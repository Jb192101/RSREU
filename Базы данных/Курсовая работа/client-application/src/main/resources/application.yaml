spring:
  application:
    name: client-app
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres_db
    username: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true

server:
  port: 8081
