services:
  book-postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: postgres_db
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC+3
    ports:
      - "5433:5432"
    volumes:
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/stored-procedures.sql:/docker-entrypoint-initdb.d/02-procedures.sql:ro
      - ./docker/triggers.sql:/docker-entrypoint-initdb.d/03-triggers.sql:ro
    shm_size: "256m"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_db -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped